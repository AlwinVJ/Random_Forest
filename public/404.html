<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Random Forest Lab</title>
    <script>
      // Single Page Application redirect for GitHub Pages without hash
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var redirect = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') + l.hash;
      l.replace(redirect);
    </script>
  </head>
  <body>
    Redirecting to Random Forest Lab...
  </body>
</html>
